name: Tag

# Pushing a tag vX.Y.Z opens a draft release for it. The signed zip and version.json are
# built on the maintainer's PC (the signing key never reaches CI), so they are attached to
# the draft by hand; publishing the draft starts release.yml, which verifies everything.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag must be the version in the code
        run: |
          version=$(grep -m1 'kVersion\[\]' src/core/version.cpp | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match kVersion $version in src/core/version.cpp"
            exit 1
          fi

      - name: Open the draft release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          notes="release-notes/${TAG#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --draft --verify-tag --title "Imperivm Resurrected ${TAG#v}" --notes-file "$notes"
          else
            gh release create "$TAG" --draft --verify-tag --title "Imperivm Resurrected ${TAG#v}" --generate-notes
          fi
          echo "Draft created. Attach imperivm-resurrected-${TAG#v}.zip and version.json, then publish it." >> "$GITHUB_STEP_SUMMARY"
