name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to check (for example v0.31.54)
        required: true
      announce:
        description: Also announce it in the Discord channels of new versions
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  assets:
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download what was attached to the release
        shell: bash
        run: gh release download "$TAG" --dir assets --clobber

      - name: Build the SDK zip from sdk/ at this tag
        run: node tools/build-sdk-zip.js assets

      - name: Verify the release (version, signature, hashes, contents)
        shell: bash
        run: |
          rm -f assets/SHA256SUMS.txt
          node tools/verify-release.js assets --tag "$TAG" --write-sums

      - name: Attach the SDK zip and the checksums
        shell: bash
        run: gh release upload "$TAG" assets/imperivm-resurrected-sdk-*.zip assets/SHA256SUMS.txt --clobber

      - name: Attest where the files were verified
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: assets/*

  withdraw:
    needs: [checks, assets]
    if: always() && github.event_name == 'release' && (needs.checks.result == 'failure' || needs.assets.result == 'failure')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Back to draft (a release that failed verification must not be the latest one)
        run: gh release edit "$TAG" --draft --repo "$GITHUB_REPOSITORY"

  discord:
    needs: assets
    if: github.event_name == 'release' || inputs.announce
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DISCORD_WEBHOOK_ES: ${{ secrets.DISCORD_WEBHOOK_ES }}
      DISCORD_WEBHOOK_EN: ${{ secrets.DISCORD_WEBHOOK_EN }}
      DISCORD_WEBHOOK_IT: ${{ secrets.DISCORD_WEBHOOK_IT }}
      DISCORD_ROLE_ES: ${{ vars.DISCORD_ROLE_ES }}
      DISCORD_ROLE_EN: ${{ vars.DISCORD_ROLE_EN }}
      DISCORD_ROLE_IT: ${{ vars.DISCORD_ROLE_IT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Announce the release in the Discord channels of new versions (links to the website)
        run: node tools/announce-release.js --tag "$TAG"
