name: Build DLL

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: [src/**, third_party/**, CMakeLists.txt, .github/workflows/build-dll.yml]
  pull_request:
    paths: [src/**, third_party/**, CMakeLists.txt, .github/workflows/build-dll.yml]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Steamworks SDK headers (private repository, read only)
        uses: actions/checkout@v4
        with:
          repository: imperivm-resurrected/steamworks-headers
          ssh-key: ${{ secrets.STEAMWORKS_HEADERS_KEY }}
          path: third_party/steamworks_sdk

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build winmm.dll
        run: |
          cmake -S . -B build/dll -G Ninja -DCMAKE_BUILD_TYPE=Release -DIMPERIVM_BUILD_TESTS=OFF
          cmake --build build/dll

      - name: Show the version resource of the DLL
        shell: pwsh
        run: (Get-Item build/dll/winmm.dll).VersionInfo | Format-List ProductName, ProductVersion, FileVersion, OriginalFilename, FileDescription

      - name: Keep the unsigned DLL
        uses: actions/upload-artifact@v4
        with:
          name: winmm-dll-unsigned
          path: build/dll/winmm.dll
          if-no-files-found: error
